name: .NET-Version prüfen

# Wird mit der neuesten LTS-Version von .NET gebaut?
#
# LTS-Versionen (.NET 8, 10, 12 ...) werden drei Jahre unterstützt,
# STS-Versionen (.NET 9, 11 ...) nur zwei. Gebaut wird deshalb immer mit der
# neuesten LTS-Version - nie mit einer neueren STS-Version, auch wenn sie
# schon erschienen ist.
#
# Maßstab ist die Liste von Microsoft, aus der auch die Download-Seite
# gespeist wird (releases-index.json): die höchste LTS-Version, die
# unterstützt wird - also weder Vorschau noch Release Candidate.
#
# Die Workflows holen sich ihr SDK über .github/actions/dotnet-lts selbst aus
# dieser Liste; dort steht keine feste Nummer. Geprüft wird hier jede Stelle,
# die die Version FEST nennt:
#
#   <TargetFramework> in jeder .csproj / .props    net10.0, net10.0-windows
#   sdk.version in global.json                     falls vorhanden
#   die SDK-Prüfung in build.ps1                   falls vorhanden
#   .NET-Einrichtung in den Workflows              nur über .github/actions/dotnet-lts
#
# Steht irgendwo eine andere Version - oder richtet ein Workflow .NET an der
# gemeinsamen Aktion vorbei ein -, schlägt die Prüfung fehl und nennt Datei
# und Zeile. Zusätzlich läuft sie jeden Montag von selbst: Erscheint eine neue
# LTS-Version, wird sie rot, bis die Projektdateien nachgezogen sind.

on:
  push:
    paths-ignore: [ 'update.json', 'docs/**', '**/*.md' ]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  aktuell:
    name: Neueste LTS-Version von .NET
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Gegen die Liste von Microsoft prüfen
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          from pathlib import Path

          QUELLEN = [
              'https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json',
              'https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/releases-index.json',
          ]
          AKTION = './.github/actions/dotnet-lts'

          def lade_liste():
              # Zum Ausprobieren ohne Netz: RELEASES_INDEX=pfad/zur/datei.json
              if os.environ.get('RELEASES_INDEX'):
                  return json.loads(Path(os.environ['RELEASES_INDEX']).read_text(encoding='utf-8'))
              fehler = ''
              for versuch in range(3):
                  for url in QUELLEN:
                      try:
                          with urllib.request.urlopen(url, timeout=30) as antwort:
                              return json.load(antwort)
                      except Exception as ex:
                          fehler = f'{url}: {ex}'
                  time.sleep(10 * (versuch + 1))
              print(f'::error::Die Liste der .NET-Versionen war nicht abrufbar ({fehler}).')
              sys.exit(1)

          def zahlen(version):
              return tuple(int(teil) for teil in version.split('.'))

          liste = lade_liste()['releases-index']
          # Unterstützt heißt: weder Vorschau (preview) noch Release Candidate
          # (go-live) noch aus dem Support (eol).
          unterstuetzt = [r for r in liste if r.get('support-phase') in ('active', 'maintenance')]
          lts = [r for r in unterstuetzt if r.get('release-type') == 'lts']
          if not lts:
              print('::error::In der Liste von Microsoft steht keine unterstützte LTS-Version.')
              sys.exit(1)
          neueste = max(lts, key=lambda r: zahlen(r['channel-version']))
          soll = neueste['channel-version']
          print(f".NET {soll} ist die neueste LTS-Version (Laufzeit {neueste.get('latest-runtime')}, "
                f"SDK {neueste.get('latest-sdk')}, vom {neueste.get('latest-release-date')}, "
                f"Support bis {neueste.get('eol-date') or '?'}).")
          for r in sorted(unterstuetzt, key=lambda r: zahlen(r['channel-version'])):
              if zahlen(r['channel-version']) > zahlen(soll):
                  print(f".NET {r['channel-version']} ist neuer, aber {str(r.get('release-type', '?')).upper()} "
                        f"(kurzer Support) - wird bewusst nicht verwendet.")
          print()
          art_von = {r['channel-version']: str(r.get('release-type', '')).upper() for r in liste}

          # (Datei, Zeile, was dort steht, die Version darin oder None, Art der Stelle)
          stellen = []

          def zeilen(pfad):
              return enumerate(pfad.read_text(encoding='utf-8-sig', errors='replace').splitlines(), 1)

          for pfad in sorted(Path('.').rglob('*')):
              teile = set(pfad.parts)
              if not pfad.is_file() or teile & {'.git', 'bin', 'obj', 'publish', 'node_modules'}:
                  continue

              if pfad.suffix in ('.csproj', '.props', '.targets'):
                  for nr, zeile in zeilen(pfad):
                      for m in re.finditer(r'<TargetFrameworks?>([^<]+)</TargetFrameworks?>', zeile):
                          for tfm in m.group(1).split(';'):
                              tfm = tfm.strip()
                              v = re.fullmatch(r'net(\d+\.\d+)(-.+)?', tfm)
                              if v:
                                  stellen.append((pfad, nr, tfm, v.group(1), 'Zielframework'))

              elif pfad.parent == Path('.github/workflows') and pfad.suffix in ('.yml', '.yaml'):
                  for nr, zeile in zeilen(pfad):
                      if zeile.lstrip().startswith('#'):
                          continue
                      if re.search(r'uses:\s*' + re.escape(AKTION) + r'\s*$', zeile):
                          stellen.append((pfad, nr, 'neueste LTS, automatisch', soll, 'SDK im Workflow'))
                      elif re.search(r'uses:\s*actions/setup-dotnet', zeile):
                          stellen.append((pfad, nr, 'actions/setup-dotnet direkt', None, 'SDK im Workflow'))
                      v = re.search(r'''dotnet-version:\s*['"]?((\d+\.\d+)[^'"\s]*)''', zeile)
                      if v:
                          stellen.append((pfad, nr, f'feste Nummer {v.group(1)}', None, 'SDK im Workflow'))

              elif pfad.name == 'global.json':
                  version = (json.loads(pfad.read_text(encoding='utf-8-sig')).get('sdk') or {}).get('version')
                  if version:
                      nr = next((nr for nr, zeile in zeilen(pfad) if version in zeile), 1)
                      stellen.append((pfad, nr, version, '.'.join(version.split('.')[:2]), 'SDK in global.json'))

              elif pfad.name == 'build.ps1':
                  # Die SDK-Prüfung des Bauskripts:  $_ -match '^\s*10\.'
                  for nr, zeile in zeilen(pfad):
                      v = re.search(r"-match\s+'\^\\s\*(\d+)\\\.'", zeile)
                      if v:
                          stellen.append((pfad, nr, f'SDK {v.group(1)}', v.group(1) + '.0', 'SDK-Prüfung in build.ps1'))

          if not stellen:
              print('::error::Keine Stelle gefunden, an der die .NET-Version festgelegt wird. Hat sich der Aufbau geändert?')
              sys.exit(1)

          falsch = 0
          for pfad, nr, text, version, art in stellen:
              ok = version == soll
              print(f"  [{'OK' if ok else 'FALSCH'}]  {pfad.as_posix()}:{nr}  {art}: {text}")
              if ok:
                  continue
              falsch += 1
              if version is None:
                  grund = (f'keine feste Version und kein direktes setup-dotnet - bitte "uses: {AKTION}" '
                           f'verwenden, die nimmt immer die neueste LTS-Version')
              elif zahlen(version) > zahlen(soll):
                  wie = 'eine STS-Version (kurzer Support)' if art_von.get(version) == 'STS' else 'eine Vorschau'
                  grund = f'{text} ist {wie} - gebaut wird mit der neuesten LTS-Version, .NET {soll}'
              else:
                  grund = f'{text} ist veraltet - die neueste LTS-Version ist .NET {soll}'
              print(f'::error file={pfad.as_posix()},line={nr}::{art}: {grund}.')

          print()
          if falsch:
              print(f'{falsch} von {len(stellen)} Stellen bauen nicht mit der neuesten LTS-Version (.NET {soll}).')
              sys.exit(1)
          print(f'Alle {len(stellen)} Stellen bauen mit .NET {soll}, der neuesten LTS-Version.')
          PY
