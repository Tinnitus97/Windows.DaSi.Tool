name: .NET-Version prüfen

# Wird mit der richtigen .NET-Version gebaut?
#
# Maßstab ist die Liste von Microsoft, aus der auch die Download-Seite gespeist
# wird (releases-index.json). Geprüft wird jede Stelle, die beim Bauen die
# Version festlegt:
#
#   <TargetFramework> in jeder .csproj / .props    net10.0, net10.0-windows
#   dotnet-version in den Workflows                10.0.x
#   sdk.version in global.json                     10.0.100
#   die SDK-Prüfung in build.ps1                   '^\s*10\.'
#
# SOLL-VERSION:
#   - Steht in global.json eine SDK-Version, ist das Projekt auf diese
#     .NET-Version FESTGELEGT. Dann müssen alle Stellen genau sie nennen. Eine
#     neuere Version wird nur als Hinweis gemeldet. Rot wird die Prüfung erst,
#     wenn die festgelegte Version nicht mehr unterstützt wird; ein halbes
#     Jahr vorher warnt sie.
#     Derzeit: .NET 10 (LTS), weil die EXE mit .NET 11 (Version 1.2.0) auf
#     Windows-10-Rechnern nicht startete.
#   - Ohne Festlegung: die neueste stabile Version, also weder Vorschau noch
#     Release Candidate.
#
# Steht irgendwo eine andere Version, schlägt die Prüfung fehl und nennt Datei
# und Zeile. Zusätzlich läuft sie jeden Montag von selbst - Supportende und
# neue .NET-Versionen kommen, ohne dass sich im Repository etwas ändert.

on:
  push:
    paths-ignore: [ 'update.json', 'docs/**', '**/*.md' ]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aktuell:
    name: Neueste stabile .NET-Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Gegen die Liste von Microsoft prüfen
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          from pathlib import Path

          QUELLEN = [
              'https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json',
              'https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/releases-index.json',
          ]

          def lade_liste():
              # Zum Ausprobieren ohne Netz: RELEASES_INDEX=pfad/zur/datei.json
              if os.environ.get('RELEASES_INDEX'):
                  return json.loads(Path(os.environ['RELEASES_INDEX']).read_text(encoding='utf-8'))
              fehler = ''
              for versuch in range(3):
                  for url in QUELLEN:
                      try:
                          with urllib.request.urlopen(url, timeout=30) as antwort:
                              return json.load(antwort)
                      except Exception as ex:
                          fehler = f'{url}: {ex}'
                  time.sleep(10 * (versuch + 1))
              print(f'::error::Die Liste der .NET-Versionen war nicht abrufbar ({fehler}).')
              sys.exit(1)

          def zahlen(version):
              return tuple(int(teil) for teil in version.split('.'))

          # Stabil heißt: keine Vorschau (preview) und kein Release Candidate (go-live).
          lade_liste.cache = lade_liste()
          stabil = [r for r in lade_liste.cache['releases-index']
                    if r.get('support-phase') in ('active', 'maintenance')]
          if not stabil:
              print('::error::In der Liste von Microsoft steht keine stabile .NET-Version.')
              sys.exit(1)
          neueste = max(stabil, key=lambda r: zahlen(r['channel-version']))
          print(f".NET {neueste['channel-version']} ist die neueste stabile Version "
                f"({neueste.get('release-type', '?').upper()}, Laufzeit {neueste.get('latest-runtime')}, "
                f"SDK {neueste.get('latest-sdk')}, vom {neueste.get('latest-release-date')}).")

          # Festlegung in global.json? Dann gilt sie statt der neuesten Version.
          festgelegt = None
          if Path('global.json').is_file():
              sdk = (json.loads(Path('global.json').read_text(encoding='utf-8-sig')).get('sdk') or {}).get('version')
              if sdk:
                  festgelegt = '.'.join(sdk.split('.')[:2])

          if festgelegt:
              soll = festgelegt
              eintrag = next((r for r in lade_liste.cache['releases-index']
                              if r.get('channel-version') == soll), None)
              phase = (eintrag or {}).get('support-phase', 'unbekannt')
              ende = (eintrag or {}).get('eol-date') or '?'
              print(f"Das Projekt ist in global.json auf .NET {soll} festgelegt "
                    f"({(eintrag or {}).get('release-type', '?').upper()}, Support bis {ende}).")
              if phase not in ('active', 'maintenance'):
                  print(f'::error file=global.json::.NET {soll} wird nicht mehr unterstützt '
                        f'(Phase: {phase}, Supportende: {ende}). Die Festlegung muss auf eine '
                        f'unterstützte Version wechseln - vorher auf Windows 10 testen.')
                  sys.exit(1)
              try:
                  rest = (time.strptime(ende, '%Y-%m-%d'), time.gmtime())
                  tage = int((time.mktime(rest[0]) - time.mktime(rest[1])) // 86400)
                  if tage <= 183:
                      print(f'::warning file=global.json::Der Support für .NET {soll} endet in {tage} Tagen '
                            f'({ende}). Rechtzeitig auf eine neuere Version wechseln - vorher auf Windows 10 testen.')
              except ValueError:
                  pass
              if zahlen(neueste['channel-version']) > zahlen(soll):
                  print(f"::notice::.NET {neueste['channel-version']} ist erschienen; das Projekt bleibt "
                        f"wie festgelegt bei .NET {soll}.")
          else:
              soll = neueste['channel-version']
          print()

          # (Datei, Zeile, was dort steht, die Version darin, Art der Stelle)
          stellen = []

          def zeilen(pfad):
              return enumerate(pfad.read_text(encoding='utf-8-sig', errors='replace').splitlines(), 1)

          for pfad in sorted(Path('.').rglob('*')):
              teile = set(pfad.parts)
              if not pfad.is_file() or teile & {'.git', 'bin', 'obj', 'publish', 'node_modules'}:
                  continue

              if pfad.suffix in ('.csproj', '.props', '.targets'):
                  for nr, zeile in zeilen(pfad):
                      for m in re.finditer(r'<TargetFrameworks?>([^<]+)</TargetFrameworks?>', zeile):
                          for tfm in m.group(1).split(';'):
                              tfm = tfm.strip()
                              v = re.fullmatch(r'net(\d+\.\d+)(-.+)?', tfm)
                              if v:
                                  stellen.append((pfad, nr, tfm, v.group(1), 'Zielframework'))

              elif pfad.parent == Path('.github/workflows') and pfad.suffix in ('.yml', '.yaml'):
                  for nr, zeile in zeilen(pfad):
                      v = re.search(r'''dotnet-version:\s*['"]?((\d+\.\d+)[^'"\s]*)''', zeile)
                      if v:
                          stellen.append((pfad, nr, v.group(1), v.group(2), 'SDK im Workflow'))

              elif pfad.name == 'global.json':
                  version = (json.loads(pfad.read_text(encoding='utf-8-sig')).get('sdk') or {}).get('version')
                  if version:
                      nr = next((nr for nr, zeile in zeilen(pfad) if version in zeile), 1)
                      stellen.append((pfad, nr, version, '.'.join(version.split('.')[:2]), 'SDK in global.json'))

              elif pfad.name == 'build.ps1':
                  # Die SDK-Prüfung des Bauskripts:  $_ -match '^\s*10\.'
                  for nr, zeile in zeilen(pfad):
                      v = re.search(r"-match\s+'\^\\s\*(\d+)\\\.'", zeile)
                      if v:
                          stellen.append((pfad, nr, f'SDK {v.group(1)}', v.group(1) + '.0', 'SDK-Prüfung in build.ps1'))

          if not stellen:
              print('::error::Keine Stelle gefunden, an der die .NET-Version festgelegt wird. Hat sich der Aufbau geändert?')
              sys.exit(1)

          veraltet = 0
          for pfad, nr, text, version, art in stellen:
              ok = version == soll
              print(f"  [{'OK' if ok else 'ALT'}]  {pfad.as_posix()}:{nr}  {art}: {text}")
              if ok:
                  continue
              veraltet += 1
              if festgelegt:
                  print(f'::error file={pfad.as_posix()},line={nr}::{art}: {text} weicht von der '
                        f'Festlegung in global.json ab - das Projekt baut mit .NET {soll}.')
              else:
                  wie = 'eine Vorschau' if zahlen(version) > zahlen(soll) else 'veraltet'
                  print(f'::error file={pfad.as_posix()},line={nr}::{art}: {text} ist {wie} - '
                        f'die neueste stabile Version ist .NET {soll}.')

          print()
          if veraltet:
              print(f'{veraltet} von {len(stellen)} Stellen bauen nicht mit .NET {soll}.')
              sys.exit(1)
          print(f'Alle {len(stellen)} Stellen bauen mit .NET {soll}'
                + (' (festgelegt in global.json).' if festgelegt else '.'))
          PY
