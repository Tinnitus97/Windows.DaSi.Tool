name: Bauen und prüfen

# Läuft bei jedem Push und jedem Pull Request.
# Zweck: Übersetzt der Quelltext noch, und laufen die Prüfungen durch?
# Veröffentlicht wird hier NICHTS - das macht release.yml beim Setzen eines
# Etiketts oder per Knopfdruck.

on:
  push:
    # update.json schreibt der Veröffentlichungs-Workflow selbst fort - dafür
    # muss hier nicht erneut gebaut werden.
    paths-ignore: [ 'update.json', 'docs/**', '**/*.md' ]
  pull_request:
  workflow_dispatch:

# Zeitlimits: Ohne Angabe darf ein Job bis zu 6 Stunden laufen. Bleibt ein
# Läufer hängen (schon vorgekommen: der Schritt stand, selbst der Abbruch kam
# nicht an), blockiert er sonst einen halben Tag lang den Status des Zweigs.
# Die Grenzen liegen weit über der üblichen Dauer (Linux ~30 s, Windows
# ~2 min), damit ein langsamer Paketabruf nicht schon als Fehler gilt.

jobs:
  # Die Dienste ohne Oberfläche - läuft auf Linux und ist in Sekunden durch.
  pruefungen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet-lts

      - name: Prüfungen ausführen
        run: dotnet run --project tests/DaSiTests -c Release

  # Das eigentliche Programm zielt auf Windows und braucht deshalb einen
  # Windows-Läufer.
  uebersetzen:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet-lts

      # Dieselben Prüfungen wie unter Linux - und zusätzlich die, die nur hier
      # gehen: Das Austauschskript der Selbstaktualisierung wird wirklich von
      # cmd.exe ausgeführt, mit Umlauten im Pfad. Wie cmd eine Batchdatei
      # liest, lässt sich nur auf einem echten Windows prüfen.
      - name: Prüfungen unter Windows
        run: dotnet run --project tests/DaSiTests -c Release

      # Bewusst OHNE --warnaserror: Eine neue Avalonia-Fassung bringt gelegentlich
      # eine zusätzliche Warnung mit. Das soll auffallen, aber nicht den Zweig
      # blockieren. Warnungen stehen im Protokoll dieses Schrittes.
      - name: Kompilieren
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter 'WindowsDaSiTool.csproj' | Select-Object -First 1
          if (-not $csproj) { throw 'WindowsDaSiTool.csproj nicht gefunden.' }
          dotnet build $csproj.FullName -c Release

      # Nur zum Ausprobieren eines Zwischenstandes - die ausgelieferte EXE
      # entsteht in release.yml.
      - name: Probeweise veröffentlichen
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter 'WindowsDaSiTool.csproj' | Select-Object -First 1
          dotnet publish $csproj.FullName -c Release -r win-x64 -o publish `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false

      - uses: actions/upload-artifact@v7
        with:
          name: WindowsDaSiTool-Testbau
          path: publish/WindowsDaSiTool.exe
          retention-days: 3

  # Der Hintergrund verhaelt sich unter Windows 11 anders als unter Windows
  # Server (windows-latest): Dort ueberlebt eine Volltonfarbe den Neustart des
  # Explorers, bei einem Anwender unter Windows 11 nicht. Deshalb dieselbe
  # echte Pruefung auf einem Windows-11-Laeufer (ARM64, fuer oeffentliche
  # Repositories frei) - nur der Hintergrund-Teil (DASI_NUR=hintergrund).
  # Vorerst zur Auskunft: Ein Fehlschlag hier haelt den Zweig nicht auf.
  hintergrund-windows11:
    runs-on: windows-11-arm
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dotnet-lts

      - name: Hintergrund unter Windows 11
        env:
          DASI_NUR: hintergrund
        run: dotnet run --project tests/DaSiTests -c Release
