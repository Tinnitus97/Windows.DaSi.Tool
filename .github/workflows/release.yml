name: Veröffentlichen

# Builds WindowsDaSiTool.exe, attaches it with its checksum to a release and
# then updates update.json - the file the program checks.
#
# TWO WAYS TO TRIGGER IT:
#
#   1. Create and push a tag (GitHub Desktop: right-click a commit in the
#      history -> "Create Tag…", then "Push origin").
#
#   2. Without a tag, without a command line: in the "Actions" tab pick
#      this workflow on the left, "Run workflow" on the right, enter the
#      number. The tag is created automatically.

on:
  push:
    # Deliberately generous: in this repository the tags have so far been
    # plain "1.0.5" - without a leading v. So that a tag does not fizzle out
    # because it is spelled differently than expected, several patterns
    # match. The number is then read from the name.
    tags:
      - '[0-9]*'          # 1.0.6
      - 'v*'              # v1.0.6
      - 'V*'              # V1.0.6
      - 'version-*'       # version-1.0.6
      - 'Version-*'       # Version-1.0.6

  workflow_dispatch:
    inputs:
      nummer:
        description: 'Versionsnummer, z.B. 1.0.6'
        type: string
        required: true

permissions:
  contents: write

jobs:
  programm:
    runs-on: windows-latest
    # A hanging runner should not keep a release open for hours. A few minutes
    # are usual.
    timeout-minutes: 30
    steps:
      # For a tag its commit, for the button the default branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dotnet-lts

      - name: Version und Etikett bestimmen
        id: version
        shell: pwsh
        run: |
          $istKnopf = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $roh = if ($istKnopf) { '${{ inputs.nummer }}' } else { '${{ github.ref_name }}' }

          # The number is EXTRACTED from the name instead of just cutting off a "v".
          # That way "1.0.6", "v1.0.6" and "Version-1.0.6" all work.
          $treffer = [regex]::Match($roh.Trim(), '\d+\.\d+\.\d+(\.\d+)?')
          if (-not $treffer.Success) {
            Write-Host "::error::Aus '$roh' lässt sich keine Versionsnummer der Form 1.2.3 lesen."
            exit 1
          }
          $version = $treffer.Value

          # For a tag keep using its name unchanged - otherwise a second tag with a
          # different name would appear next to the one that was pushed.
          # For the button the usual spelling here: the bare number.
          $tag = if ($istKnopf) { $version } else { '${{ github.ref_name }}' }

          # Cross-check: does the project file carry the same number?
          $csproj = Get-ChildItem -Recurse -Filter 'WindowsDaSiTool.csproj' | Select-Object -First 1
          if (-not $csproj) { throw 'WindowsDaSiTool.csproj nicht gefunden.' }

          $inFile = ([xml](Get-Content $csproj.FullName)).Project.PropertyGroup.Version |
                    Where-Object { $_ }
          if ($inFile -ne $version) {
            Write-Host "::error::Nummer $version passt nicht zu <Version>$inFile</Version> in $($csproj.Name). Bitte erst die Projektdatei anpassen."
            exit 1
          }

          "version=$version"           >> $env:GITHUB_OUTPUT
          "tag=$tag"                   >> $env:GITHUB_OUTPUT
          "csproj=$($csproj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Kompilieren
        shell: pwsh
        run: |
          dotnet publish '${{ steps.version.outputs.csproj }}' `
            -c Release -r win-x64 -o publish `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false
          if (-not (Test-Path 'publish/WindowsDaSiTool.exe')) { throw 'EXE wurde nicht erzeugt.' }

      - name: Prüfsumme bilden
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/WindowsDaSiTool.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash *WindowsDaSiTool.exe" | Out-File publish/SHA256SUMS.txt -Encoding ascii

      # Creates the tag as well if it does not exist yet (button path).
      - name: Veröffentlichung anlegen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Windows DaSi Tool ${{ steps.version.outputs.version }}
          files: |
            publish/WindowsDaSiTool.exe
            publish/SHA256SUMS.txt
          generate_release_notes: true

      # The build may have run from a tag - that is a detached state without a
      # branch. So switch to the default branch before writing update.json. The
      # name is deliberately NOT hard-coded but comes from the repository
      # itself: if the default branch is ever renamed, the workflow keeps
      # running instead of failing on the name.
      - name: update.json fortschreiben
        shell: pwsh
        env:
          ZWEIG: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin $env:ZWEIG
          git checkout -B $env:ZWEIG origin/$env:ZWEIG

          python tools/write-update-json.py `
            --repo    '${{ github.repository }}' `
            --tag     '${{ steps.version.outputs.tag }}' `
            --version '${{ steps.version.outputs.version }}' `
            --sha256  '${{ steps.hash.outputs.sha256 }}' `
            --datei   'WindowsDaSiTool.exe'
          if ($LASTEXITCODE -ne 0) { throw 'update.json konnte nicht geschrieben werden.' }

          git add update.json

          # "git diff --quiet" reports through its exit code, not through text. An
          # "if (git diff …)" would always be false because the command prints
          # nothing - so check $LASTEXITCODE explicitly.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'update.json war bereits aktuell.'
            exit 0
          }

          git commit -m "update.json: Version ${{ steps.version.outputs.version }} [skip ci]"
          git push origin $env:ZWEIG
