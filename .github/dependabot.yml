# Keeps the NuGet packages up to date by itself.
#
# Once a week Dependabot checks whether there is a newer version of a
# package from a .csproj and opens a pull request for it. build.yml builds
# and tests it like any other branch - so whatever fails there cannot be
# merged by accident. Nothing is merged automatically; that stays a click.
#
# IMPORTANT: the file only takes effect once it is on the default branch.
# On another branch it does nothing.
#
# Dependabot reports security vulnerabilities right away, independent of
# this schedule - provided "Dependabot security updates" is enabled in the
# repository settings.

version: 2

updates:
  - package-ecosystem: nuget

    # "/" means the whole repository: Dependabot searches the subfolders from
    # the root as well and so finds WindowsDaSiTool.csproj and the test
    # projects under tests\.
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin

    # More than three open package requests at a time are no use - they go
    # stale faster than they get reviewed.
    open-pull-requests-limit: 3

    commit-message:
      prefix: "Pakete"

    groups:
      # The four Avalonia packages always carry the same version number and must
      # move together. Raised one by one, the build would fail on contradicting
      # versions - which is why there is deliberately NO update-types here: even
      # the jump to a new major version comes as a single pull request that
      # raises all four together.
      avalonia:
        patterns:
          - "Avalonia*"

      # Everything else (CommunityToolkit.Mvvm, Tmds.DBus.Protocol, ...) in one
      # shared request - but only small jumps. A new major version deliberately
      # comes on its own, so it can be looked at separately.
      uebrige-pakete:
        patterns:
          - "*"
        exclude-patterns:
          - "Avalonia*"
        update-types:
          - minor
          - patch

  # The same care for the actions in .github/workflows/ - checkout,
  # setup-dotnet, upload-artifact and the rest. Until now they were
  # maintained by hand and were accordingly uneven (checkout@v4 next to
  # checkout@v5, upload-artifact@v4 next to @v6); from now on Dependabot
  # raises them.
  - package-ecosystem: github-actions

    # For actions, "/" literally means the repository root: Dependabot then
    # looks in .github/workflows/. Plus our own action
    # .github/actions/dotnet-lts - it calls setup-dotnet and should be raised
    # as well.
    directories:
      - "/"
      - "/.github/actions/*"

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin

    open-pull-requests-limit: 3

    commit-message:
      prefix: "Aktionen"

    groups:
      # All actions in one single request, deliberately without update-types.
      # For the official actions, a new major version almost always only
      # switches the runner's Node version; raising them together keeps the
      # workflows consistent with each other - which is exactly the point.
      aktionen:
        patterns:
          - "*"
